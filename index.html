async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return'x'+h}}

 function rs(){c.width=innerWidth;c.height=innerHeight;S=Array.from({length:Math.floor(innerWidth*innerHeight/6500)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.1+.2,p:Math.random()*6.28,s:.4+Math.random()*1.2}))}

const newPlayer=(id,n)=>({id,name:n,lname:n.toLowerCase(),atoms:START_ATOMS,els:{},role:n.toLowerCase()==='yeebus'?'Owner':'Common',avatar:'',last:0,streak:0,bio:'',created:Date.now()});

 d:()=>JSON.parse(store.get('bs_local')||'{"players":{},"cred":{},"chat":[]}'),w:d=>store.set('bs_local',JSON.stringify(d)),
 async get(id){return L.d().players[id]||null},async save(p){const d=L.d();d.players[p.id]=p;L.w(d)},
 async del(id){const d=L.d();delete d.players[id];delete d.cred[id];L.w(d);store.del('bs_sess')},
 async byName(l){return L.d().players[l]||null},
 async register(n,p){const l=n.toLowerCase();if(L.d().players[l])return{err:'That username is already taken.'};const d=L.d();d.cred[l]=await hash(l+p);d.players[l]=newPlayer(l,n);L.w(d);store.set('bs_sess',l);return{pl:d.players[l]}},
 async login(n,p){const l=n.toLowerCase(),d=L.d();if(!d.players[l]||d.cred[l]!==await hash(l+p))return{err:'Incorrect username or password.'};store.set('bs_sess',l);return{pl:d.players[l]}},
 async restore(){const s=store.get('bs_sess');return s?L.get(s):null},async logout(){store.del('bs_sess')},
 top(cb){cb(Object.values(L.d().players).sort((a,b)=>b.atoms-a.atoms).slice(0,10));return()=>{}},

 playerSub(id,cb){return L.listen(()=>cb(L.d().players[id]||null))},
 cfgSub(cb){return L.listen(()=>cb(L.d().cfg||{daily:50}))},

 async changePass(p){const d=L.d();d.cred[P.id]=await hash(P.lname+p);L.w(d)},
 ls:new Set(),notify(){L.ls.forEach(f=>f())},listen(fn){L.ls.add(fn);fn();return()=>L.ls.delete(fn)},
 chatSub(cb){return L.listen(()=>cb(L.d().chat.slice(-60)))},
 async chatSend(m){const d=L.d();d.chat.push(m);d.chat=d.chat.slice(-CHATMAX);L.w(d);L.notify()},
 fd(){const d=L.d();d.friends=d.friends||{};d.dms=d.dms||{};return d},

 $('#df').onsubmit=async e=>{e.preventDefault();const t=$('#di').value.replace(/\s+/g,' ').trim();if(!t||!dmPair)return;if(Date.now()-lastSend<1200)return toast('Slow down!');lastSend=Date.now();$('#di').value='';
  try{await B.dmSend(dmPair,{from:P.id,name:P.name,text:t.slice(0,CHATMAX),ts:Date.now()})}catch(x){toast('Message failed to send')}};
 let fu=()=>{};try{fu=B.friendsSub(l=>{FRL=l;list();if(dmPair&&!FRL.some(f=>f.pair===dmPair&&f.status==='accepted'))closeDm()},()=>toast('Friends unavailable'))}catch(e){toast('Friends unavailable')}
 unsub=()=>{fu();dmu&&dmu()}}

function settings(){shell('settings',`<div class="center"><div class="title" style="font-size:3rem">Settings</div><div class="tag">Signed in as ${esc(P.name)}</div>
 <button class="btn" id="cp">Change password</button><button class="btn" id="lo">Log out</button><button class="btn" id="de" style="background:#e55;color:#fff;filter:none">Delete account</button></div>`);
 $('#lo').onclick=logout;$('#cp').onclick=changePw;$('#de').onclick=()=>modal('<h2>Delete your account?</h2><div class="t">This permanently removes your atoms and elements.</div><div class="rw"><button class="b" id="y">Yes</button><button class="b" id="n">No</button></div>',(m,c)=>{
  $('#n',m).onclick=c;$('#y',m).onclick=async()=>{c();try{await B.del(P.id)}catch(e){}P=null;go('')}})}

function crates(){
 shell('crates',`<div class="crates">${CRATES.map((c,i)=>`<div class="crate${c.name==='Spungle'?' sol':''}" style="--c:${c.color}" data-i="${i}"><div class="nm">${c.name} Crate</div><div class="ct" style="background:${CT[c.name]}${CT[c.name].startsWith('url')?' center/cover':''}"></div><div class="pr">${fmt(c.price)} ${ATOM}</div></div>`).join('')}</div>`);
 document.querySelectorAll('.crate').forEach(e=>e.onclick=()=>buy(CRATES[e.dataset.i]))}
const wsum=c=>c.items.reduce((a,x)=>a+x.w,0);
const RCW={Common:'#555',Uncommon:'#2e9a1b',Rare:'#2a2aff',Epic:'#d00000',Legendary:'#ff8c00',Fabled:'#0c7500',Perfect:'#c9a800',Mythical:'#a335ee',Divine:'#d14fd1'};
function rates(c){const t=wsum(c),pc=v=>v<.01?(+v.toFixed(6))+'%':v<1?v.toFixed(3)+'%':v.toFixed(2)+'%',rows=c.items.slice().sort((a,b)=>a.i-b.i||b.w-a.w);
 modal(`<h2 style="color:#444;text-shadow:none">${c.name} Crate Rates</h2><div class="rls">${rows.map(x=>`<div class="rr2"><b style="color:${RCW[RAR[x.i]]}">${esc(EL[x.n].name)}</b><span style="color:${RCW[RAR[x.i]]}">${RAR[x.i]}</span><i>${pc(x.w/t*100)}</i></div>`).join('')}</div><button class="b" id="ok">Okay</button>`,(m,k)=>$('#ok',m).onclick=k,'wide')}
function roll(c){let r=Math.random()*wsum(c);for(const x of c.items){if((r-=x.w)<=0)return x}return c.items[0]}
function buy(c){modal(`<h2>Purchase the ${c.name} Crate for ${fmt(c.price)} atoms?</h2><button class="b" id="rt">Rates</button><div class="rw"><button class="b" id="y">Yes</button><button class="b" id="n">No</button></div>`,(m,close)=>{
 $('#rt',m).onclick=()=>rates(c);$('#n',m).onclick=close;
 $('#y',m).onclick=async()=>{close();if(P.atoms<c.price)return toast('Not enough atoms');
  P.atoms-=c.price;const it=roll(c),isNew=!P.els[it.n];P.els[it.n]=(P.els[it.n]||0)+1;persist();setBal();
  showLoading();await sleep(1700);hideLoading();reveal(it,isNew)}})}
function reveal(it,isNew){const col=COL[RAR[it.i]],d=document.createElement('div');d.className='reveal';
 d.innerHTML=`<div class="rn">${nm(it.n)}</div><div class="rt" style="background-image:${tex(it.n)}">${isNew?'<span class="nw">NEW!</span>':''}</div><div class="rr" style="color:${col};text-shadow:0 0 22px ${col}">${RAR[it.i]}</div>`;
 const cv=document.createElement('canvas');cv.id='pc';cv.width=innerWidth;cv.height=innerHeight;document.body.append(d,cv);
 const g=cv.getContext('2d'),mk=(burst)=>{const a=Math.random()*6.28,s=burst?2+Math.random()*(5+it.i):0;return{x:burst?cv.width/2:Math.random()*cv.width,y:burst?cv.height/2:-10,vx:Math.cos(a)*s,vy:burst?Math.sin(a)*s-1.5:.5+Math.random()*.9,r:Math.random()*6,w:2+Math.random()*2.5,h:4+Math.random()*6,life:0,max:230+Math.random()*120}};
 let Q=Array.from({length:80+it.i*30},()=>mk(true)),t0=performance.now();
 (function f(t){if(!d.isConnected)return cv.remove();g.clearRect(0,0,cv.width,cv.height);g.fillStyle=col;const el=t-t0;
  if(el<3400)Q.push(mk(false));
  Q=Q.filter(p=>{p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.vx*=.99;p.r+=.1;g.globalAlpha=Math.max(0,1-p.life/p.max);g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();return p.life<p.max});
  requestAnimationFrame(f)})(t0);
 const end=()=>{d.classList.add('out');setTimeout(()=>d.remove(),850)};d.onclick=end;setTimeout(()=>d.isConnected&&end(),6200)}

let sel=null,view='own';
function elements(){const own=Object.keys(P.els).filter(k=>EL[k]&&P.els[k]>0).sort((a,b)=>EL[b].r-EL[a].r||a.localeCompare(b));
 if(!own.includes(sel))sel=own[0]||null;const e=sel&&EL[sel],col=e?COL[RAR[e.r]]:'#fff';
 const star="url('data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#111"/><path d="M50 12l11 26 28 3-21 19 6 28-24-15-24 15 6-28-21-19 28-3z" fill="#fff"/></svg>')+"')";
 const all=Object.keys(EL).sort((a,b)=>EL[b].r-EL[a].r||a.localeCompare(b));
 const tiles=view==='own'?(own.length?own.map((k,i)=>`<div class="gt${k===sel?' s':''}" data-k="${k}" title="${nm(k)}" style="background-image:${tex(k)}"></div>`).join(''):'<span style="opacity:.5">Open a crate to collect elements</span>')
  :all.map((k,i)=>{const o=P.els[k]>0;return`<div class="gt${o?'':' lock'}${k===sel?' s':''}" data-k="${k}" data-o="${o?1:0}" title="${o?nm(k):'???'} · ${RAR[EL[k].r]}" style="background-image:${tex(k)};border-color:${o?COL[RAR[EL[k].r]]==='#2a2aff'?'#6a6aff':'#fff':'#555'}"></div>`}).join('');
 shell('elements',`<div class="pan"><div class="box" style="color:${col};text-shadow:0 0 18px ${col}">${e?RAR[e.r]:'Common'}</div>
  <div style="text-align:center"><div class="etile" id="big" style="background-image:${sel?tex(sel):star}"><span class="qty">${sel?P.els[sel]:1}</span></div><div style="font-size:1.2rem;margin-top:.5rem">${sel?nm(sel):'Betastar'}</div></div>
  <div class="box" style="font-size:${e?1.6:1.1}rem;text-shadow:0 0 12px #fff">${e?fmt(e.price)+' Atoms':"Can't be sold."}</div></div>
  <div class="tabs"><span data-v="own" class="${view==='own'?'on':''}">Owned</span><span data-v="all" class="${view==='all'?'on':''}">Collection ${own.length}/${TOTAL}</span></div><div class="grid">${tiles}</div>`);
 document.querySelectorAll('.tabs span').forEach(t=>t.onclick=()=>{view=t.dataset.v;elements()});
 document.querySelectorAll('.gt').forEach(t=>t.onclick=()=>{if(view==='all'&&t.dataset.o==='0')return toast('Not discovered yet');sel=t.dataset.k;view='own';elements()});
 $('#big').onclick=$('#big').oncontextmenu=ev=>{ev.preventDefault();document.querySelector('.menu')?.remove();
  const m=document.createElement('div');m.className='menu';m.style.cssText=`left:${Math.min(ev.clientX,innerWidth-140)}px;top:${ev.clientY}px`;
  m.innerHTML=(sel?'<p id="s">Sell Element</p>':'')+'<p id="a">Set Avatar</p>';document.body.appendChild(m);
  const rm=()=>{m.remove();removeEventListener('mousedown',out)},out=x=>{if(!m.contains(x.target))rm()};setTimeout(()=>addEventListener('mousedown',out));
  $('#a',m).onclick=()=>{P.avatar=sel||'';persist();rm();toast('Avatar updated!')};if(sel)$('#s',m).onclick=()=>{rm();sell()}}}
function sell(){const k=sel,max=P.els[k];
 modal(`<h2>How much ${nm(k)} would you like to sell?</h2><div class="t"><input class="fld" id="q" inputmode="numeric" style="width:6rem;height:1.8rem;filter:none;background:#eee"> / ${max}</div><div class="rw"><button class="b" id="y">Sell</button><button class="b" id="n">Cancel</button></div>`,(m,close)=>{
  const q=$('#q',m);q.focus();q.oninput=()=>{let v=q.value.replace(/\D/g,'');if(v&&+v>max)v=String(max);q.value=v};
  $('#n',m).onclick=close;$('#y',m).onclick=()=>{const n=+q.value;if(!(n>0))return;P.els[k]-=n;P.atoms+=n*EL[k].price;if(!P.els[k])delete P.els[k];persist();close();toast(`Sold ${n} ${nm(k)}`);elements();setBal()}})}

/* ===================== ROUTER / BOOT ===================== */
const PAGES={'':landing,login:()=>authPage(false),register:()=>authPage(true),home,leaders,chat,friends,crates,elements,settings};
function render(){let r=route in PAGES?route:'';if(P&&(r===''||r==='login'||r==='register'))r='home';if(!P&&r!==''&&r!=='login'&&r!=='register')r='';route=r;if(P)startLive();else stopLive();PAGES[r]()}
console.log('%c%s','color: white; font-size: 100px;text-shadow: 0px 0px 20px black;','Hold Up!');
console.log('%c%s','color: white; font-size: 25px;text-shadow: 0px 0px 5px red;',"If someone told you to copy/paste something here you have an 11/10 chance you're being scammed.");
console.log('%c%s','color: white; font-size: 35px;text-shadow: 0px 0px 10px darkred;','Pasting anything in here could give attackers access to your Betastar account.');
(async function boot(){showLoading();await initBackend();try{P=await B.restore()}catch(e){}hideLoading();render()})();
</script>
</body>
