  <button id="fr" ${b('#d9b8ff','#111','#c9a3ff')}>Friends <span class="bd" id="bd"></span></button><button id="bi" ${b('#ffd98a','#111','#ffd98a')}>Edit Bio</button></div>
  <div class="prof"><div class="av" style="--c:${c};${P.avatar?'background-image:'+tex(P.avatar):''}"></div><h1 style="--c:${c}">${esc(P.name)}</h1><p>Role: ${esc(P.role)}</p><p>Atoms: ${fmt(P.atoms)}</p>
  <input class="pill" id="un" placeholder="Enter Username Here"><button class="pill" id="vs">View Stats</button><button class="pill" id="tr">Trade</button>
  <div class="biobox"><div class="bh">Bio</div>${P.bio?esc(P.bio):'<span style="opacity:.5">No bio yet — press Edit Bio to add your Discord, YouTube and more.</span>'}</div></div></div>`);
 $('#d').onclick=()=>{const left=P.last+864e5-Date.now();if(left>0)return toast(`Come back in ${Math.ceil(left/36e5)}h`);
  P.streak=Date.now()-P.last<1728e5?(P.streak||0)+1:1;const g=DAILY+Math.min(P.streak,7)*10;P.last=Date.now();P.atoms+=g;persist();toast(`+${g} atoms — ${P.streak} day streak!`);home()};
 $('#nw').onclick=showNews;$('#fr').onclick=()=>go('friends');$('#bi').onclick=editBio;$('#tr').onclick=()=>toast('Trading is not available yet');
 $('#vs').onclick=async()=>{const n=$('#un').value.trim();if(!n)return;let x;try{x=await B.byName(n.toLowerCase())}catch(e){}
  if(!x)return errBox('User not found.');
  modal(`<h2>${esc(x.name)}</h2><div class="t">Role: ${esc(x.role)}<br>Atoms: ${fmt(x.atoms)}<br>Elements: ${Object.values(x.els||{}).reduce((a,b)=>a+b,0)}${x.bio?`<br><br>${esc(x.bio)}`:''}</div>${x.id!==P.id?'<button class="b" id="af">Add Friend</button>':''}<button class="b" id="ok">Okay</button>`,(m,c)=>{$('#ok',m).onclick=c;const a=$('#af',m);if(a)a.onclick=()=>{c();addFriend(x)}})}
 try{unsub=B.friendsSub(l=>{FRL=l;const n=l.filter(f=>f.status==='pending'&&f.from!==P.id).length,e=$('#bd');if(e){e.textContent=n||'';e.style.display=n?'inline-block':'none'}})}catch(e){}}

function leaders(){const rk=['1st','2nd','3rd'],rc=['#ffd700','#fff','#ff9a2e'];
 shell('leaders',`<div class="lb">${Array.from({length:10},(_,i)=>`<div class="row"><span class="n"></span><span class="r" style="color:${rc[i]||'#fff'}">${rk[i]||(i+1)+'th'}</span><span class="a"></span></div>`).join('')}</div>`);
 const fill=l=>document.querySelectorAll('.row').forEach((r,i)=>{const p=l[i];r.querySelector('.n').textContent=p?p.name:'';r.querySelector('.n').style.color=p&&p.id===P.id?'#8ed0ff':'#fff';r.querySelector('.a').textContent=p?fmt(p.atoms):''});
 try{unsub=B.top(fill,()=>toast('Leaderboard unavailable'))}catch(e){toast('Leaderboard unavailable')}}

let lastSend=0;
function makeDraw(cb){let first=true;const f=list=>{const near=cb.scrollHeight-cb.scrollTop-cb.clientHeight<80||first;
 cb.innerHTML=list.map(m=>`<div class="msg"><i>${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</i><b style="color:${nameCol(m.name)}">${esc(m.name)}</b>${esc(m.text)}</div>`).join('')||'<div class="msg" style="opacity:.5">No messages yet — say hi!</div>';
 first=false;if(near)cb.scrollTop=cb.scrollHeight};f.reset=()=>{first=true};return f}
function chat(){shell('chat',`<div class="chat"><div class="cbox" id="cb"></div><form class="cin" id="cf"><input class="fld" id="ci" placeholder="Type a message…" maxlength="${CHATMAX}" autocomplete="off"><input class="btn" type="submit" value="Send"></form></div>`);
 try{unsub=B.chatSub(makeDraw($('#cb')),()=>toast('Chat unavailable'))}catch(e){toast('Chat unavailable')}
 $('#cf').onsubmit=async e=>{e.preventDefault();const t=$('#ci').value.replace(/\s+/g,' ').trim();if(!t)return;
  if(Date.now()-lastSend<1200)return toast('Slow down!');lastSend=Date.now();$('#ci').value='';
  try{await B.chatSend({uid:P.id,name:P.name,text:t.slice(0,CHATMAX),ts:Date.now()});chatReward(t)}catch(x){toast('Message failed to send')}};$('#ci').focus()}

function friends(){let dmPair=null,dmu=null;
 shell('home',`<div class="fr"><div class="flist"><div class="fh">Friends</div><input class="pill" id="fn" placeholder="Add friend by username" maxlength="16"><button class="pill" id="fb">Send Request</button><div id="fl"></div></div>
 <div class="dm"><div class="dh" id="dh">Select a friend to message</div><div class="cbox" id="dbx"></div><form class="cin" id="df"><input class="fld" id="di" placeholder="Message…" maxlength="${CHATMAX}" autocomplete="off" disabled><input class="btn" type="submit" value="Send"></form></div></div>`);
 const draw=makeDraw($('#dbx'));
 const closeDm=()=>{dmu&&dmu();dmu=null;dmPair=null;$('#dh').textContent='Select a friend to message';$('#di').disabled=true;$('#dbx').innerHTML=''};
 const openDm=(pair,name)=>{dmu&&dmu();dmPair=pair;$('#dh').textContent=name;$('#di').disabled=false;$('#di').focus();draw.reset();
  try{dmu=B.dmSub(pair,draw,()=>toast('Messages unavailable'))}catch(e){toast('Messages unavailable')}list()};
 function list(){const me=P.id,oth=f=>f.users.find(x=>x!==me),nm=f=>esc(f.names[oth(f)]);
  const req=FRL.filter(f=>f.status==='pending'&&f.from!==me),out=FRL.filter(f=>f.status==='pending'&&f.from===me),fr=FRL.filter(f=>f.status==='accepted');
  $('#fl').innerHTML=(req.length?'<div class="fs">Requests</div>':'')+req.map(f=>`<div class="fi"><span>${nm(f)}</span><span><button class="mini" data-a="${f.pair}">Accept</button> <button class="mini" data-d="${f.pair}">Decline</button></span></div>`).join('')
   +(fr.length?'<div class="fs">Friends</div>':'')+fr.map(f=>`<div class="fi${f.pair===dmPair?' sel':''}" data-o="${f.pair}" data-n="${nm(f)}"><span>${nm(f)}</span><button class="mini" data-d="${f.pair}">Remove</button></div>`).join('')
   +(out.length?'<div class="fs">Sent</div>':'')+out.map(f=>`<div class="fi"><span>${nm(f)}</span><button class="mini" data-d="${f.pair}">Cancel</button></div>`).join('')
   +(FRL.length?'':'<div class="fs">No friends yet — send a request!</div>')}
 $('#fl').onclick=async e=>{const t=e.target,a=t.dataset.a,d=t.dataset.d,o=t.closest('[data-o]');
  try{if(a)await B.friendAccept(a);else if(d){await B.friendDel(d);if(d===dmPair)closeDm()}else if(o)openDm(o.dataset.o,o.dataset.n)}catch(x){toast('Action failed')}};
 $('#fb').onclick=async()=>{const n=$('#fn').value.trim();if(!n)return;let x;try{x=await B.byName(n.toLowerCase())}catch(e){}if(!x)return errBox('User not found.');$('#fn').value='';addFriend(x)};
 $('#df').onsubmit=async e=>{e.preventDefault();const t=$('#di').value.replace(/\s+/g,' ').trim();if(!t||!dmPair)return;if(Date.now()-lastSend<1200)return toast('Slow down!');lastSend=Date.now();$('#di').value='';
  try{await B.dmSend(dmPair,{from:P.id,name:P.name,text:t.slice(0,CHATMAX),ts:Date.now()})}catch(x){toast('Message failed to send')}};
 let fu=()=>{};try{fu=B.friendsSub(l=>{FRL=l;list();if(dmPair&&!FRL.some(f=>f.pair===dmPair&&f.status==='accepted'))closeDm()},()=>toast('Friends unavailable'))}catch(e){toast('Friends unavailable')}
 unsub=()=>{fu();dmu&&dmu()}}

function settings(){shell('settings',`<div class="center"><div class="title" style="font-size:3rem">Settings</div><div class="tag">Signed in as ${esc(P.name)}</div>
 <button class="btn" id="lo">Log out</button><button class="btn" id="de" style="background:#e55;color:#fff;filter:none">Delete account</button></div>`);
 $('#lo').onclick=logout;$('#de').onclick=()=>modal('<h2>Delete your account?</h2><div class="t">This permanently removes your atoms and elements.</div><div class="rw"><button class="b" id="y">Yes</button><button class="b" id="n">No</button></div>',(m,c)=>{
  $('#n',m).onclick=c;$('#y',m).onclick=async()=>{c();try{await B.del(P.id)}catch(e){}P=null;go('')}})}

function crates(){
 shell('crates',`<div class="crates">${CRATES.map((c,i)=>`<div class="crate${c.name==='Spungle'?' sol':''}" style="--c:${c.color}" data-i="${i}"><div class="nm">${c.name} Crate</div><div class="ct" style="background:${CT[c.name]}${CT[c.name].startsWith('url')?' center/cover':''}"></div><div class="pr">${fmt(c.price)} ${ATOM}</div></div>`).join('')}</div>`);
 document.querySelectorAll('.crate').forEach(e=>e.onclick=()=>buy(CRATES[e.dataset.i]))}
const wsum=c=>c.items.reduce((a,x)=>a+x.w,0);
function rates(c){const t=wsum(c),by={};c.items.forEach(x=>by[x.i]=(by[x.i]||0)+x.w/t*100);
 modal(`<h2 style="color:#444;text-shadow:none">${c.name} Crate Rates</h2>${Object.keys(by).sort((a,b)=>a-b).map(i=>`<div class="t" style="color:${RAR[i]==='Common'?'#555':COL[RAR[i]]}">${RAR[i]}: ${by[i]<1?+by[i].toFixed(6):by[i].toFixed(1)}%</div>`).join('')}<button class="b" id="ok">Okay</button>`,(m,x)=>$('#ok',m).onclick=x)}
function roll(c){let r=Math.random()*wsum(c);for(const x of c.items){if((r-=x.w)<=0)return x}return c.items[0]}
function buy(c){modal(`<h2>Purchase the ${c.name} Crate for ${fmt(c.price)} atoms?</h2><button class="b" id="rt">Rates</button><div class="rw"><button class="b" id="y">Yes</button><button class="b" id="n">No</button></div>`,(m,close)=>{
 $('#rt',m).onclick=()=>rates(c);$('#n',m).onclick=close;
 $('#y',m).onclick=async()=>{close();if(P.atoms<c.price)return toast('Not enough atoms');
  P.atoms-=c.price;const it=roll(c),isNew=!P.els[it.n];P.els[it.n]=(P.els[it.n]||0)+1;persist();setBal();
  const sp=document.createElement('div');sp.className='bsp';sp.textContent='B';document.body.appendChild(sp);await sleep(1500);sp.remove();reveal(it,isNew)}})}
function reveal(it,isNew){const col=COL[RAR[it.i]],d=document.createElement('div');d.className='reveal';
 d.innerHTML=`<div class="rn">${nm(it.n)}</div><div class="rt" style="background-image:${tex(it.n)}">${isNew?'<span class="nw">NEW!</span>':''}</div><div class="rr" style="color:${col};text-shadow:0 0 22px ${col}">${RAR[it.i]}</div>`;
 const cv=document.createElement('canvas');cv.id='pc';cv.width=innerWidth;cv.height=innerHeight;document.body.append(d,cv);
 const g=cv.getContext('2d'),mk=(burst)=>{const a=Math.random()*6.28,s=burst?2+Math.random()*(5+it.i):0;return{x:burst?cv.width/2:Math.random()*cv.width,y:burst?cv.height/2:-10,vx:Math.cos(a)*s,vy:burst?Math.sin(a)*s-1.5:.5+Math.random()*.9,r:Math.random()*6,w:2+Math.random()*2.5,h:4+Math.random()*6,life:0,max:230+Math.random()*120}};
 let Q=Array.from({length:80+it.i*30},()=>mk(true)),t0=performance.now();
 (function f(t){if(!d.isConnected)return cv.remove();g.clearRect(0,0,cv.width,cv.height);g.fillStyle=col;const el=t-t0;
  if(el<3400)Q.push(mk(false));
  Q=Q.filter(p=>{p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.vx*=.99;p.r+=.1;g.globalAlpha=Math.max(0,1-p.life/p.max);g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();return p.life<p.max});
  requestAnimationFrame(f)})(t0);
 const end=()=>{d.classList.add('out');setTimeout(()=>d.remove(),850)};d.onclick=end;setTimeout(()=>d.isConnected&&end(),6200)}

let sel=null,view='own';
function elements(){const own=Object.keys(P.els).filter(k=>EL[k]&&P.els[k]>0).sort((a,b)=>EL[b].r-EL[a].r||a.localeCompare(b));
 if(!own.includes(sel))sel=own[0]||null;const e=sel&&EL[sel],col=e?COL[RAR[e.r]]:'#fff';
 const star="url('data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#111"/><path d="M50 12l11 26 28 3-21 19 6 28-24-15-24 15 6-28-21-19 28-3z" fill="#fff"/></svg>')+"')";
 const all=Object.keys(EL).sort((a,b)=>EL[b].r-EL[a].r||a.localeCompare(b));
 const tiles=view==='own'?(own.length?own.map((k,i)=>`<div class="gt${k===sel?' s':''}" data-k="${k}" title="${nm(k)}" style="background-image:${tex(k)}"></div>`).join(''):'<span style="opacity:.5">Open a crate to collect elements</span>')
  :all.map((k,i)=>{const o=P.els[k]>0;return`<div class="gt${o?'':' lock'}${k===sel?' s':''}" data-k="${k}" data-o="${o?1:0}" title="${o?nm(k):'???'} · ${RAR[EL[k].r]}" style="background-image:${tex(k)};border-color:${o?COL[RAR[EL[k].r]]==='#2a2aff'?'#6a6aff':'#fff':'#555'}"></div>`}).join('');
 shell('elements',`<div class="pan"><div class="box" style="color:${col};text-shadow:0 0 18px ${col}">${e?RAR[e.r]:'Common'}</div>
  <div style="text-align:center"><div class="etile" id="big" style="background-image:${sel?tex(sel):star}"><span class="qty">${sel?P.els[sel]:1}</span></div><div style="font-size:1.2rem;margin-top:.5rem">${sel?nm(sel):'Betastar'}</div></div>
  <div class="box" style="font-size:${e?1.6:1.1}rem;text-shadow:0 0 12px #fff">${e?fmt(e.price)+' Atoms':"Can't be sold."}</div></div>
  <div class="tabs"><span data-v="own" class="${view==='own'?'on':''}">Owned</span><span data-v="all" class="${view==='all'?'on':''}">Collection ${own.length}/${TOTAL}</span></div><div class="grid">${tiles}</div>`);
 document.querySelectorAll('.tabs span').forEach(t=>t.onclick=()=>{view=t.dataset.v;elements()});
 document.querySelectorAll('.gt').forEach(t=>t.onclick=()=>{if(view==='all'&&t.dataset.o==='0')return toast('Not discovered yet');sel=t.dataset.k;view='own';elements()});
 $('#big').onclick=$('#big').oncontextmenu=ev=>{ev.preventDefault();document.querySelector('.menu')?.remove();
  const m=document.createElement('div');m.className='menu';m.style.cssText=`left:${Math.min(ev.clientX,innerWidth-140)}px;top:${ev.clientY}px`;
  m.innerHTML=(sel?'<p id="s">Sell Element</p>':'')+'<p id="a">Set Avatar</p>';document.body.appendChild(m);
  const rm=()=>{m.remove();removeEventListener('mousedown',out)},out=x=>{if(!m.contains(x.target))rm()};setTimeout(()=>addEventListener('mousedown',out));
  $('#a',m).onclick=()=>{P.avatar=sel||'';persist();rm();toast('Avatar updated!')};if(sel)$('#s',m).onclick=()=>{rm();sell()}}}
function sell(){const k=sel,max=P.els[k];
 modal(`<h2>How much ${nm(k)} would you like to sell?</h2><div class="t"><input class="fld" id="q" inputmode="numeric" style="width:6rem;height:1.8rem;filter:none;background:#eee"> / ${max}</div><div class="rw"><button class="b" id="y">Sell</button><button class="b" id="n">Cancel</button></div>`,(m,close)=>{
  const q=$('#q',m);q.focus();q.oninput=()=>{let v=q.value.replace(/\D/g,'');if(v&&+v>max)v=String(max);q.value=v};
  $('#n',m).onclick=close;$('#y',m).onclick=()=>{const n=+q.value;if(!(n>0))return;P.els[k]-=n;P.atoms+=n*EL[k].price;if(!P.els[k])delete P.els[k];persist();close();toast(`Sold ${n} ${nm(k)}`);elements();setBal()}})}

/* ===================== ROUTER / BOOT ===================== */
const PAGES={'':landing,login:()=>authPage(false),register:()=>authPage(true),home,leaders,chat,friends,crates,elements,settings};
function render(){let r=route in PAGES?route:'';if(P&&(r===''||r==='login'||r==='register'))r='home';if(!P&&r!==''&&r!=='login'&&r!=='register')r='';route=r;PAGES[r]()}
console.log('%c%s','color: white; font-size: 100px;text-shadow: 0px 0px 20px black;','Hold Up!');
console.log('%c%s','color: white; font-size: 25px;text-shadow: 0px 0px 5px red;',"If someone told you to copy/paste something here you have an 11/10 chance you're being scammed.");
console.log('%c%s','color: white; font-size: 35px;text-shadow: 0px 0px 10px darkred;','Pasting anything in here could give attackers access to your Betastar account.');
(async function boot(){await initBackend();try{P=await B.restore()}catch(e){}render()})();
</script>
</body>
